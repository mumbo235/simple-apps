<script>
try {
  const st = JSON.parse(localStorage.getItem('calc.settings') || '{}');
  const m = st.mode === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.mode = m;
  document.querySelector('meta[name="theme-color"]').content = m === 'light' ? '#ffffff' : '#141414';
  document.querySelector('meta[name="color-scheme"]').content = m;
  document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = m === 'light' ? 'default' : 'black';
} catch {}
</script>

<style>
.display{background:var(--surface);border-radius:20px;padding:14px 18px 16px;margin:18px 0 15px;min-height:158px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.display-top{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-height:28px}
#expression{flex:1;text-align:right;color:var(--faint);font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;text-transform:none;min-width:0}
#backspace{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint);font-size:16px;transition:background .16s,color .16s}
#backspace:hover{background:var(--surface2);color:var(--fg)}
#backspace svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#result{text-align:right;font-size:clamp(2.7em,12vw,4em);font-weight:300;letter-spacing:-.07em;line-height:1.05;font-variant-numeric:tabular-nums;word-break:break-all;transition:color .16s}
#result.error{color:var(--mute)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.key{height:56px;border-radius:14px;background:var(--surface2);color:var(--fg);font-size:1.16em;font-weight:400;display:grid;place-items:center;transition:background .16s,transform .12s,color .16s;font-variant-numeric:tabular-nums}
.key:hover{background:var(--surface3)}
.key:active{transform:scale(.96)}
.key.fn{color:var(--mute);font-size:.9em}
.key.op{color:var(--mute);font-size:1.3em}
.key.equals{grid-column:1/-1;height:54px;background:var(--accent);color:var(--accent-ink);font-size:1.1em;margin-top:1px}
.key.equals:hover{background:var(--accent);opacity:.9}
.history{margin-top:28px}
.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--faint);font-size:.7em;letter-spacing:.06em;padding:0 2px 5px}
.history-head button{height:26px;padding:0 8px;border-radius:7px;color:var(--faint);font-size:.9em}
.history-head button:hover{background:var(--surface2);color:var(--fg)}
.history-list{display:flex;flex-direction:column;gap:1px}
.history-row{display:flex;align-items:baseline;gap:10px;width:100%;padding:9px 8px;margin:0 -8px;border-radius:10px;text-align:left;transition:background .16s}
.history-row:hover{background:var(--surface)}
.history-row .hx{flex:1;min-width:0;color:var(--mute);font-size:.78em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none}
.history-row .hr{flex:none;color:var(--fg);font-size:.9em;font-variant-numeric:tabular-nums}
.history-empty{color:var(--faint);font-size:.82em;padding:12px 0}
@media (max-width:520px){
  .display{padding:12px 14px 14px;min-height:142px}
  .key{height:52px;border-radius:12px;font-size:1.08em}
  .key.equals{height:50px}
  .keypad{gap:6px}
}
</style>

<body>

  <section class="display" aria-label="calculator display">
    <div class="display-top"><span id="expression"></span><button type="button" id="backspace" aria-label="backspace"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12V5z"/><path d="M12 9l5 6M17 9l-5 6"/></svg></button></div>

    <div class="field"><div class="lbl">text size</div><div class="seg" data-seg="size"><button data-v="s">small</button><button data-v="m">medium</button><button data-v="l">large</button></div></div>
    <div class="field"><div class="lbl">density</div><div class="seg" data-seg="density"><button data-v="compact">compact</button><button data-v="comfy">comfy</button><button data-v="airy">airy</button></div></div>

    <button type="button" class="linkbtn" id="installBtn">install calc</button>
    <button type="button" class="linkbtn" id="exportBtn">export history</button>
    <button type="button" class="linkbtn" id="importBtn">import history</button>

    <div class="hint">history stays in this browser. nothing is sent anywhere.</div>

  <h3>info</h3>
  <div class="card">
    <div class="status"><span class="st" id="buildInfo">calc v1.0</span></div>
    <div class="hint">a quiet calculator. parentheses, percent, and your own keyboard.</div>
  </div>
</aside>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
window.APP_CONFIG = {
  ns: 'calc', title: 'calc', build: 'v1.0',
  mottos: ['one number at a time', 'show your work', 'keep it simple', 'add it up', 'no rush', 'just the numbers']
};
</script>
<script src="base.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
let expression = '';
let lastResult = 0;
let justEvaluated = false;
let history = App.store.get('history', []);
if (!Array.isArray(history)) history = [];
history = history.filter(h => h && typeof h.expression === 'string' && isFinite(+h.result)).slice(-50);
const saveHistory = () => App.store.set('history', history);

/* ---------- expression parser ---------- */
function tokenize(src) {
  const s = String(src).replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  const out = [];
  let i = 0;
  let prev = null;
  while (i < s.length) {
    const c = s[i];
    if (/\d|\./.test(c)) {
      let j = i, dot = false;
      while (j < s.length && /[\d.]/.test(s[j])) {
        if (s[j] === '.') { if (dot) break; dot = true; }
        j++;
      }
      const num = s.slice(i, j);
      if (!num || num === '.') throw new Error('number');
      out.push({ t: 'num', v: parseFloat(num) });
      prev = 'num';
      i = j;
      continue;
    }
    if (c === '(') { out.push({ t: '(' }); prev = '('; i++; continue; }
    if (c === ')') { out.push({ t: ')' }); prev = ')'; i++; continue; }
    if (c === '%') {
      if (prev !== 'num' && prev !== ')') throw new Error('percent');
      out.push({ t: 'op', v: '%' });
      prev = 'op';
      i++;
      continue;
    }
    if (c === '+' || c === '*' || c === '/') {
      if (prev === null || prev === 'op' || prev === '(') throw new Error('operator');
      out.push({ t: 'op', v: c });
      prev = 'op';
      i++;
      continue;
    }
    if (c === '-') {
      if (prev === null || prev === 'op' || prev === '(') out.push({ t: 'op', v: 'u-' });
      else out.push({ t: 'op', v: '-' });
      prev = 'op';
      i++;
      continue;
    }
    throw new Error('character');
  }
  return out;
}
function evaluate(src) {
  const tokens = tokenize(src);
  if (!tokens.length) throw new Error('empty');
  const out = [];
  const ops = [];
  const prec = { 'u-': 4, '%': 4, '*': 3, '/': 3, '+': 2, '-': 2 };
  const right = { 'u-': true };
  for (const tok of tokens) {
    if (tok.t === 'num') out.push(tok.v);
    else if (tok.t === '(') ops.push(tok);
    else if (tok.t === ')') {
      let found = false;
      while (ops.length) {
        const top = ops.pop();
        if (top.t === '(') { found = true; break; }
        out.push(top.v);
      }
      if (!found) throw new Error('paren');
    } else {
      while (ops.length) {
        const top = ops[ops.length - 1];
        if (top.t !== 'op') break;
        const pTop = prec[top.v] || 0, pTok = prec[tok.v] || 0;
        if (pTop > pTok || (pTop === pTok && right[tok.v])) out.push(ops.pop().v);
        else break;
      }
      ops.push(tok);
    }
  }
  while (ops.length) {
    const top = ops.pop();
    if (top.t === '(') throw new Error('paren');
    out.push(top.v);
  }
  const stack = [];
  for (const v of out) {
    if (typeof v === 'number') { stack.push(v); continue; }
    if (v === 'u-') { if (!stack.length) throw new Error('syntax'); stack.push(-stack.pop()); continue; }
    if (v === '%') { if (!stack.length) throw new Error('syntax'); stack.push(stack.pop() / 100); continue; }
    if (stack.length < 2) throw new Error('syntax');
    const b = stack.pop(), a = stack.pop();
    if (v === '+') stack.push(a + b);
    else if (v === '-') stack.push(a - b);
    else if (v === '*') stack.push(a * b);
    else if (v === '/') { if (b === 0) throw new Error('divide by zero'); stack.push(a / b); }
  }
  if (stack.length !== 1 || !isFinite(stack[0])) throw new Error('result');
  return stack[0];
}
function fmt(n) {
  if (!isFinite(n)) return 'error';
  if (Math.abs(n) >= 1e12 || (Math.abs(n) > 0 && Math.abs(n) < 1e-9)) return n.toExponential(6).replace(/\.?0+e/, 'e');
  const s = n.toLocaleString(undefined, { maximumFractionDigits: 10, useGrouping: true });
  return s;
}
function preview() {
  let text = expression;
  if (justEvaluated && text) text += ' =';
  $('#expression').textContent = text;
  if (!expression) { lastResult = 0; }
  else if (!justEvaluated) {
    try { lastResult = evaluate(expression); } catch {}
  }
  $('#result').textContent = fmt(+lastResult || 0);
  $('#result').classList.remove('error');
  $('#sub').textContent = history.length ? 'history · ' + history.length : 'ready';
}
function setExpr(v) {
  expression = v;
  justEvaluated = false;
  preview();
}
function clearAll() {
  expression = ''; lastResult = 0; justEvaluated = false; preview();
}
function backspace() {
  if (justEvaluated) { clearAll(); return; }
  expression = expression.slice(0, -1);
  preview();
}
function append(key) {
  if (key === 'AC') { clearAll(); return; }
  if (key === '=') { equals(); return; }
  if (key === '±') { toggleSign(); return; }
  if (key === '.') {
    if (justEvaluated) { expression = ''; lastResult = 0; justEvaluated = false; }
    if (expression.endsWith(')') || expression.endsWith('%')) expression += '*';
    const tail = expression.split(/[+\-*/(]/).pop();
    if (tail.includes('.')) return;
    if (!expression || /[+\-*/(]$/.test(expression)) expression += '0.';
    else expression += '.';
    preview(); return;
  }
  if ('0123456789'.includes(key)) {
    if (justEvaluated) { expression = ''; lastResult = 0; justEvaluated = false; }
    if (expression.endsWith(')') || expression.endsWith('%')) expression += '*';
    expression += key;
    preview(); return;
  }
  if (key === '(') {
    if (justEvaluated) { expression = ''; lastResult = 0; justEvaluated = false; }
    if (/[\d.)%]$/.test(expression)) expression += '*';
    expression += '(';
    preview(); return;
  }
  if (key === ')') {
    if (justEvaluated) return;
    const open = (expression.match(/\(/g) || []).length;
    const close = (expression.match(/\)/g) || []).length;
    if (open <= close || /[+\-*/(]$/.test(expression)) return;
    expression += ')';
    preview(); return;
  }
  if (key === '%') {
    if (justEvaluated) { expression = String(lastResult); justEvaluated = false; }
    if (/[\d.)%]$/.test(expression)) { expression += '%'; preview(); }
    return;
  }
  if ('+-*/'.includes(key)) {
    if (justEvaluated) { expression = String(lastResult); justEvaluated = false; }
    if (!expression) { if (key === '-') { expression = '-'; preview(); } return; }
    if (expression.endsWith('(')) { if (key === '-') { expression += '-'; preview(); } return; }
    if (/[+\-*/]$/.test(expression)) {
      if (key === '-' && /[+*/]$/.test(expression)) { expression += '-'; preview(); return; }
      expression = expression.replace(/[+\-*/]+$/, '') + key;
      preview(); return;
    }
    expression += key;
    preview(); return;
  }
}
function toggleSign() {
  if (justEvaluated) {
    expression = String(-(+lastResult || 0));
    lastResult = -(+lastResult || 0);
    justEvaluated = false;
    preview(); return;
  }
  if (!expression) { expression = '-'; preview(); return; }
  const m = expression.match(/(\d*\.?\d+)$/);
  if (!m) return;
  const start = expression.length - m[1].length;
  const before = expression[start - 1];
  const before2 = expression[start - 2];
  if (before === '-' && (start - 1 === 0 || /[+\-*/(]/.test(before2 || ''))) {
    expression = expression.slice(0, start - 1) + m[1];
  } else {
    expression = expression.slice(0, start) + '-' + m[1];
  }
  preview();
}
function equals() {
  if (!expression) return;
  try {
    const n = evaluate(expression);
    lastResult = n;
    justEvaluated = true;
    history.push({ id: App.uid(), expression, result: n, at: Date.now() });
    if (history.length > 50) history = history.slice(-50);
    saveHistory(); renderHistory(); preview();
    if (navigator.vibrate) try { navigator.vibrate(10); } catch {}
  } catch (e) {
    $('#result').textContent = 'error';
    $('#result').classList.add('error');
    App.toast(e && /divide/.test(e.message) ? 'cannot divide by zero' : 'check the expression');
  }
}
function renderHistory() {
  const box = $('#historyList');
  box.replaceChildren();
  const list = history.slice().sort((a, b) => (+b.at || 0) - (+a.at || 0)).slice(0, 8);
  if (!list.length) {
    const e = document.createElement('div'); e.className = 'history-empty'; e.textContent = 'no calculations yet.';
    box.appendChild(e);
  } else {
    list.forEach(h => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'history-row';
      const ex = document.createElement('span'); ex.className = 'hx'; ex.textContent = h.expression;
      const re = document.createElement('span'); re.className = 'hr'; re.textContent = fmt(+h.result);
      b.append(ex, re);
      b.addEventListener('click', () => { expression = String(h.result); lastResult = +h.result; justEvaluated = true; preview(); });
      box.appendChild(b);
    });
  }
  $('#sub').textContent = history.length ? 'history · ' + history.length : 'ready';
}
function clearHistory() {
  if (!history.length) return;
  history = []; saveHistory(); renderHistory(); App.toast('history cleared');
}

$('#keypad').addEventListener('click', e => { const b = e.target.closest('[data-key]'); if (b) append(b.dataset.key); });
$('#backspace').addEventListener('click', backspace);
$('#clearHistory').addEventListener('click', clearHistory);
document.addEventListener('keydown', e => {
  if ($('#menu').classList.contains('show')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); return; }
  if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
  if (e.key === 'Escape' || e.key.toLowerCase() === 'c') { e.preventDefault(); clearAll(); return; }
  if (e.key === '%' || e.key === '(' || e.key === ')' || e.key === '.') { append(e.key); return; }
  if ('0123456789'.includes(e.key)) { append(e.key); return; }
  if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/' || e.key === 'x' || e.key === 'X') {
    append(e.key === 'x' || e.key === 'X' ? '*' : e.key);
  }
});
$('#exportBtn').addEventListener('click', () => {
  App.download('calc-history.json', JSON.stringify({ app: 'calc', v: 1, history }, null, 2));
  App.toast('history exported');
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.history)) throw 0;
      if (!confirm('replace your calculator history with this backup?')) return;
      history = d.history.filter(h => h && typeof h.expression === 'string' && isFinite(+h.result)).slice(-50).map(h => ({
        id: typeof h.id === 'string' ? h.id : App.uid(),
        expression: h.expression.slice(0, 200),
        result: +h.result,
        at: +h.at || Date.now()
      }));
      saveHistory(); renderHistory(); App.toast('imported ' + history.length + ' calculations');
    } catch { App.toast('could not import that file'); }
  };
  r.readAsText(f);
});
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('delete calculator history and settings from this browser?')) return;
  Object.keys(localStorage).filter(k => k.startsWith('calc.')).forEach(k => localStorage.removeItem(k));
  location.reload();
});

preview();
renderHistory();
window.__calc = { get expression() { return expression; }, get history() { return history; }, evaluate, append, equals, clearAll };
</script>
</body>
